      description: "Fetch a single span by its globally-unique span_id, without needing its trace_id. Returns the full span: metadata plus its input/output payload."
      operationId: "get-span"
      parameters:
        - in: "path"
          name: "spanId"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      cost:
                        type: "number"
                      duration_ms:
                        type: "number"
                      id:
                        type: "string"
                      input:
                        type: "string"
                      input_tokens:
                        minimum: 0
                        type: "integer"
                      metadata:
                        additionalProperties:
                          type: "string"
                        type: "object"
                      model:
                        nullable: true
                        type: "string"
                      name:
                        type: "string"
                      output:
                        type: "string"
                      output_object:
                        nullable: true
                        type: "string"
                      output_tokens:
                        minimum: 0
                        type: "integer"
                      parent_id:
                        nullable: true
                        type: "string"
                      service_name:
                        type: "string"
                      span_kind:
                        type: "string"
                      status:
                        enum:
                          - "UNSET"
                          - "OK"
                          - "ERROR"
                        type: "string"
                      status_message:
                        type: "string"
                      timestamp:
                        format: "date-time"
                        type: "string"
                      tokens:
                        minimum: 0
                        type: "integer"
                      tool_calls:
                        nullable: true
                        type: "string"
                      trace_id:
                        type: "string"
                      type:
                        type: "string"
                    required:
                      - "id"
                      - "trace_id"
                      - "parent_id"
                      - "name"
                      - "status"
                      - "status_message"
                      - "duration_ms"
                      - "timestamp"
                      - "type"
                      - "model"
                      - "input_tokens"
                      - "output_tokens"
                      - "tokens"
                      - "cost"
                      - "span_kind"
                      - "service_name"
                      - "metadata"
                      - "input"
                      - "output"
                      - "output_object"
                      - "tool_calls"
                    type: "object"
                required:
                  - "data"
                type: "object"
          description: "The full span (metadata + I/O payload)."
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "Invalid request parameters (validation failed)."
        "401":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "Missing or invalid API key."
        "404":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "Span not found."
        "429":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
