  /v1/artifacts:
    post:
      description: "Accepts one artifact — a screenshot, recording, report, or log emitted as proof that a change works — plus its content-addressed blob. The artifact anchors to a pull request directly (prNumber), through the recorded session that produced it, or through git context resolved to a PR later; a request with no anchor at all is refused and nothing is stored. `kind` is inferred from the media type and provenance (session / ci / local) is derived from the submission path — neither can be supplied by the caller. A session binding must name a session that already synced for the app, with `turnIndex` within its recorded turns; note the binding proves the session exists, not that the bytes came from it. `ci` is advisory: it is honored only for a shared (non-actor) API key and downgrades to `local` otherwise. `bytes` must equal the decoded blob length. `emittedAt` is display metadata; because it also starts the unmatched grace clock, the stored value is clamped to a bounded window ending at server receipt time. Retrying with the same clientArtifactId returns the already-stored artifact when the content matches and fails with 409 when it does not."
      operationId: "emit-artifact"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                artifact:
                  properties:
                    bytes:
                      minimum: 0
                      type: "integer"
                    caption:
                      maxLength: 500
                      type: "string"
                    ci:
                      type: "boolean"
                    clientArtifactId:
                      pattern: "^[A-Za-z0-9_.:-]{1,64}$"
                      type: "string"
                    commitSha:
                      maxLength: 64
                      type: "string"
                    criterionId:
                      pattern: "^[A-Za-z0-9_.:-]{1,64}$"
                      type: "string"
                    emittedAt:
                      type: "string"
                    filename:
                      maxLength: 120
                      minLength: 1
                      type: "string"
                    gitBranch:
                      maxLength: 255
                      type: "string"
                    gitRepo:
                      maxLength: 300
                      type: "string"
                    mediaType:
                      maxLength: 100
                      minLength: 1
                      type: "string"
                    prNumber:
                      exclusiveMinimum: true
                      minimum: 0
                      type: "integer"
                    repository:
                      maxLength: 200
                      type: "string"
                    session:
                      properties:
                        sessionId:
                          maxLength: 128
                          minLength: 1
                          type: "string"
                        turnIndex:
                          minimum: 0
                          type: "integer"
                      required:
                        - "sessionId"
                      type: "object"
                    sha256:
                      pattern: "^[0-9a-f]{64}$"
                      type: "string"
                  required:
                    - "clientArtifactId"
                    - "filename"
                    - "mediaType"
                    - "bytes"
                    - "sha256"
                    - "caption"
                    - "emittedAt"
                  type: "object"
                blob:
                  properties:
                    data:
                      minLength: 1
                      type: "string"
                  required:
                    - "data"
                  type: "object"
                schemaVersion:
                  enum:
                    - 1
                  type: "number"
              required:
                - "schemaVersion"
                - "artifact"
                - "blob"
              type: "object"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      id:
                        type: "string"
                      kind:
                        enum:
                          - "video"
                          - "screenshot"
                          - "report"
                          - "log"
                          - "file"
                        type: "string"
                      prNumber:
                        nullable: true
                        type: "integer"
                      provenance:
                        enum:
                          - "session"
                          - "ci"
                          - "local"
                        type: "string"
                      repository:
                        type: "string"
                      verification:
                        enum:
                          - "pending"
                          - "confirmed"
                          - "unmatched"
                        type: "string"
                    required:
                      - "id"
                      - "kind"
                      - "provenance"
                      - "verification"
                      - "prNumber"
                      - "repository"
                    type: "object"
                required:
                  - "data"
                type: "object"
          description: "The stored artifact (the existing row on an idempotent retry)."
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "Malformed body, sha256 or bytes mismatch, unknown session binding, turn index out of range, or nothing to attach to."
        "401":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "Missing or invalid API key."
        "409":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "The clientArtifactId is already stored with different content."
        "413":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      limit:
                        type: "integer"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                      - "limit"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "Blob or request exceeds the byte ceiling (`error.limit` names it)."
        "429":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      currentBytes:
                        type: "number"
                      limitBytes:
                        type: "number"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                      - "currentBytes"
                      - "limitBytes"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "Monthly storage cap exceeded (`error.currentBytes` / `error.limitBytes` carry the usage)."
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "Ingest temporarily unavailable; retry after the interval."
          headers:
            Retry-After:
              required: false
              schema:
                minimum: 0
                type: "integer"
      summary: "Emit an artifact (evidence for a pull request)"
      tags:
        - "Artifacts"
