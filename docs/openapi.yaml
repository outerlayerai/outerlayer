  /v1/scores/batch:
    post:
      description: "Create up to 1000 scores in a single request. Each item is validated independently and the response always contains a per-item results array.


        Status codes:

        \  - `201 Created` — every item succeeded.

        \  - `207 Multi-Status` — at least one item failed validation (e.g. missing `resource_id` or invalid `dataType`).

        \  - `400 Bad Request` — every item failed validation (or the envelope itself is malformed).

        \  - `413 Payload Too Large` — the request contains more than 1000 items.

        \  - `500 Internal Server Error` — the batch insert against analytics storage failed; no items were persisted.


        Pass an optional `client_id` on each item (max 128 chars) to correlate the server-generated `id` back to your own identifier in the results array. The server never inspects or stores `client_id`."
      operationId: "create-scores-batch"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                scores:
                  items:
                    properties:
                      client_id:
                        maxLength: 128
                        type: "string"
                      label:
                        type: "string"
                      name:
                        minLength: 1
                        type: "string"
                      reason:
                        type: "string"
                      resource_id:
                        minLength: 1
                        type: "string"
                      score:
                        type: "number"
                      source:
                        default: "api"
                        enum:
                          - "experiment"
                          - "annotation"
                          - "api"
                        type: "string"
                    required:
                      - "resource_id"
                      - "name"
                      - "score"
                    type: "object"
                  maxItems: 1000
                  minItems: 1
                  type: "array"
              required:
                - "scores"
              type: "object"
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      results:
                        items:
                          oneOf:
                            - properties:
                                client_id:
                                  type: "string"
                                id:
                                  format: "uuid"
                                  type: "string"
                                status:
                                  enum:
                                    - "success"
                                  type: "string"
                              required:
                                - "status"
                                - "id"
                              type: "object"
                            - properties:
                                client_id:
                                  type: "string"
                                error:
                                  properties:
                                    code:
                                      type: "string"
                                    message:
                                      type: "string"
                                  required:
                                    - "code"
                                    - "message"
                                  type: "object"
                                status:
                                  enum:
                                    - "error"
                                  type: "string"
                              required:
                                - "status"
                                - "error"
                              type: "object"
                        type: "array"
                      summary:
                        properties:
                          failed:
                            minimum: 0
                            type: "integer"
                          succeeded:
                            minimum: 0
                            type: "integer"
                          total:
                            minimum: 0
                            type: "integer"
                        required:
                          - "total"
                          - "succeeded"
                          - "failed"
                        type: "object"
                    required:
                      - "results"
                      - "summary"
                    type: "object"
                required:
                  - "data"
                type: "object"
          description: "All scores created successfully."
        "207":
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      results:
                        items:
                          oneOf:
                            - properties:
                                client_id:
                                  type: "string"
                                id:
                                  format: "uuid"
                                  type: "string"
                                status:
                                  enum:
                                    - "success"
                                  type: "string"
                              required:
                                - "status"
                                - "id"
                              type: "object"
                            - properties:
                                client_id:
                                  type: "string"
                                error:
                                  properties:
                                    code:
                                      type: "string"
                                    message:
                                      type: "string"
                                  required:
                                    - "code"
                                    - "message"
                                  type: "object"
                                status:
                                  enum:
                                    - "error"
                                  type: "string"
                              required:
                                - "status"
                                - "error"
                              type: "object"
                        type: "array"
                      summary:
                        properties:
                          failed:
                            minimum: 0
                            type: "integer"
                          succeeded:
                            minimum: 0
                            type: "integer"
                          total:
                            minimum: 0
                            type: "integer"
                        required:
                          - "total"
                          - "succeeded"
                          - "failed"
                        type: "object"
                    required:
                      - "results"
                      - "summary"
                    type: "object"
                required:
                  - "data"
                type: "object"
          description: "Partial success — some items succeeded and some failed validation."
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
