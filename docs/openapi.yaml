        "403":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "Caller lacks 'worker_run.insert' permission."
        "502":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "First turn failed to dispatch; the environment is destroyed, not leaked."
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "Worker compute is not configured on this deployment."
