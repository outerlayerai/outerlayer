  /v1/workers/environments:
    post:
      description: "Creates a persistent environment (a durable workspace the agent resumes across turns) and dispatches its first turn. Continue it with `POST /v1/workers/environments/{envId}/turns`. The returned `url` opens the session as a live chat thread in the dashboard."
      operationId: "create-worker-session"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                agent:
                  description: "Agent id (default claude-code). One of: claude-code, codex, cursor, opencode"
                  type: "string"
                base_branch:
                  type: "string"
                task_prompt:
                  description: "The session's first task."
                  minLength: 1
                  type: "string"
              required:
                - "task_prompt"
              type: "object"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      environment_id:
                        type: "string"
                      run_id:
                        type: "string"
                      status:
                        type: "string"
                      url:
                        description: "Dashboard deep link to the live session thread."
                        nullable: true
                        type: "string"
                    required:
                      - "environment_id"
                      - "run_id"
                      - "status"
                      - "url"
                    type: "object"
                required:
                  - "data"
                type: "object"
          description: "Session created; first turn dispatched."
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "Invalid request body or unknown agent."
        "401":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: "string"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                    type: "object"
                required:
                  - "error"
                type: "object"
          description: "Missing or invalid API key."
        "402":
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        enum:
                          - "entitlement_required"
                        type: "string"
                      current:
                        type: "number"
                      entitlement:
                        type: "string"
                      limit:
                        type: "number"
                      message:
                        type: "string"
                    required:
                      - "code"
                      - "message"
                      - "entitlement"
                    type: "object"
                required:
                  - "error"
                type: "object"
