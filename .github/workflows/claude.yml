name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Least-privilege default; the claude job elevates to exactly what it needs.
permissions:
  contents: read

jobs:
  claude:
    # Author gate: only repo OWNER or org MEMBER can drive
    # this agent. Without it, ANY account that can comment (author_association
    # CONTRIBUTOR / NONE / FIRST_TIME*) could `@claude` to run an autonomous
    # agent with write scope, making prompt-injection a code-integrity risk.
    # COLLABORATOR is excluded on purpose: on a public repo that association
    # covers anyone granted repo access at all, down to triage-only community
    # members, and this job holds ANTHROPIC_API_KEY plus contents/PR write.
    if: |
      (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER"]'), github.event.issue.author_association))
      )
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # id-token: write dropped — the action authenticates
    # with ANTHROPIC_API_KEY, not OIDC, so no cloud-federation token is needed.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
