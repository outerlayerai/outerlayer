name: Sync Model Registry

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering

env:
  NODE_VERSION: '24'

# Least-privilege default; jobs elevate as needed.
permissions:
  contents: read

jobs:
  sync-model-registry:
    name: Sync Model Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # create-pull-request opens a PR with the regenerated registry.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Sync model registry
        run: npx tsx scripts/sync-model-registry.ts

      # NOTE: the skill bundles no model reference — it routes model lookups to
      # `pull-models` / `generate-schema` (live, project-scoped) rather than a
      # download-once snapshot that goes stale. So there is nothing skill-side
      # to regenerate on a registry sync.

      - name: Check for changes
        id: changes
        run: |
          echo "has_changes=$(git status --porcelain packages/model-registry/models.json | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Read PR body
        id: pr-body
        if: steps.changes.outputs.has_changes != '0'
        run: |
          if [ -f /tmp/sync-pr-body.md ]; then
            {
              echo 'body<<EOF'
              cat /tmp/sync-pr-body.md
              echo ''
              echo '*This is an automated PR created by the model registry sync workflow.*'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'body=No detailed changelog available.' >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.MODEL_REGISTRY_TOKEN }}
          commit-message: "chore: sync model registry"
          title: "chore: sync model registry"
          body: ${{ steps.pr-body.outputs.body }}
          branch: auto/sync-model-registry
          base: main
          delete-branch: true
