name: 'Setup Supabase CLI'
description: 'Restore or install the pinned Supabase CLI into a cached user-space location'

inputs:
  version:
    description: 'Supabase CLI version tag'
    required: false
    default: 'v2.72.8'

runs:
  using: 'composite'
  steps:
    - name: Restore Supabase CLI cache
      id: cache-supabase-cli
      uses: actions/cache@v6
      with:
        path: ~/.cache/agentmark-tools/supabase/${{ inputs.version }}
        key: supabase-cli-${{ runner.os }}-${{ inputs.version }}

    - name: Install Supabase CLI
      if: steps.cache-supabase-cli.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        install_dir="$HOME/.cache/agentmark-tools/supabase/${VERSION}"
        mkdir -p "$install_dir"
        curl -fsSL "https://github.com/supabase/cli/releases/download/${VERSION}/supabase_linux_amd64.tar.gz" \
          | tar -xz -C "$install_dir" supabase
        chmod +x "$install_dir/supabase"

    - name: Add Supabase CLI to PATH
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: echo "$HOME/.cache/agentmark-tools/supabase/${VERSION}" >> "$GITHUB_PATH"
