# A PR that touches migrations must show the migration actually ran —
# proven by a classified `supabase migration up` in a recorded session.
# The row may only claim what the matcher proves: the command ran with
# exit 0, nothing more.
id: migration-must-run
kind: validation
row: "Migrations ran against a local database"
level: warn
when:
  paths: ["apps/tenant-dashboard/supabase/migrations/**"]
require:
  session.ran: { command: "supabase migration up", status: ok }
needs: [tool-calls.commands]
