# Squawk configuration for Supabase/PostgreSQL migrations
# See: https://squawkhq.com/docs/rules

# Exclude rules that don't apply to our workflow
excluded_rules = [
  # Migrations are auto-generated by `supabase db diff` and run inside transactions
  "require-concurrent-index-creation",
  "require-concurrent-index-deletion",
  # Timeout settings are managed by the migration runner, not individual migrations
  "require-timeout-settings",
  # Auto-generated migrations don't include IF EXISTS/IF NOT EXISTS
  "prefer-robust-stmts",
]

# Rules that detect expand-contract violations (all enabled by default):
# - adding-not-nullable-field: Adding NOT NULL without default
# - adding-serial-primary-key-field: Adding serial PK (use UUID instead)
# - ban-drop-column: Dropping columns breaks existing code
# - ban-drop-table: Dropping tables removes data
# - changing-column-type: Type changes may cause data loss
# - renaming-column: Renaming breaks existing code
# - renaming-table: Renaming breaks existing code
